<!-- Menubar Mejorado -->
<div class="menubar-area footer-fixed">
  <div class="toolbar-inner menubar-nav">

    <!-- CLIENT: Mapa -->
    <a
      *ngIf="auth.isClient()"
      class="nav-link"
      routerLink="/maps"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      title="Mapa">
      <i class="fas fa-map-marker-alt"></i>
    </a>

    <!-- PARTNER: Inicio local -->
    <a
      *ngIf="auth.isPartner()"
      class="nav-link"
      routerLink="/home-local"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      title="Inicio">
      <i class="flaticon flaticon-dog-house"></i>
    </a>

    <!-- CLIENT: Radar -->
    <a
      *ngIf="auth.isClient()"
      class="nav-link"
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      title="Radar">
      <i class="fas fa-fire"></i>
    </a>

    <!-- CLIENT: Chat -->
    <a
      *ngIf="auth.isClient()"
      class="nav-link"
      routerLink="/chat"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      title="Chat">
      <i class="flaticon flaticon-chat-1"></i>
    </a>

    <!-- PARTNER: Promociones / gestión -->
    <a
      *ngIf="auth.isPartner()"
      class="nav-link"
      routerLink="/explorer"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      title="Promociones">
      <i class="flaticon flaticon-search"></i>
    </a>

    <!-- CLIENT: Explorar -->
    <a
      *ngIf="auth.isClient()"
      class="nav-link"
      routerLink="/explorer"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      title="Explorar">
      <i class="flaticon flaticon-search"></i>
    </a>

    <!-- PARTNER: Perfil local -->
    <a
      *ngIf="auth.isPartner()"
      class="nav-link"
      routerLink="/profile-local"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      title="Perfil">
      <i class="flaticon flaticon-user"></i>
    </a>

    <!-- CLIENT: Perfil -->
    <a
      *ngIf="auth.isClient()"
      class="nav-link"
      routerLink="/profile"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      title="Perfil">
      <i class="flaticon flaticon-user"></i>
    </a>

  </div>
</div>
